# mask-crf -- the mask track's three-kind build and its full sweep: answer,
# repair AND repeat rows, so the eval reports F and
# EAR = 3*C*R*F/(C*R + C*F + R*F). The two-kind ancestor is the "cr" run
# (exp/white-cr.sh); "crf" is that plus the repeat kind.
# See steps/mask.html.
#
#   ./exp/mask-crf.slurm
#   sbatch exp/mask-crf.slurm
#
# Every stage's output name carries the sweep suffix -- currently `hn`, the
# hard-negative pair recipe (mask_dpo_data.py picks `rejected` as the best
# sample still a rubric step below `chosen`, and mints a negative on only
# MINT_RATE of the all-good answer rows). Re-running a stage overwrites that
# sweep's files, so a new recipe bumps the suffix in the four names below --
# repair_repo_name, sft_adapter, prefs, dpo_run_name -- rather than landing on
# top of the `hf` sweep the paper tables already read, and in the adapter_path
# and tag of the three configs/eval/mask-crf-*.yaml that score them.
#
# Keys not declared by a stage's Config dataclass are dropped SILENTLY -- read
# the "config: ..." line each script prints on start.

# Model
omni_path: Qwen/Qwen2.5-Omni-3B

# the build (mask_data.py). n_train utterances x 3 kinds train rows; the test
# split multiplies by the four masks as well.
ds_id: keylazy/slurp-mask-v2
n_train: 1000
n_test: 100

# the SFT LoRA (sft_qwen.py), which spells the dataset repair_ds_id: one file,
# and --task picks which half of the repair_*/asr_* keys is read.
task: repair
repair_ds_id: keylazy/slurp-mask-v2
repair_repo_name: Qwen2.5-Omni-3B-mask-v2-hn-sft
train_kinds: answer,repair,repeat
repair_epochs: 3
repair_lr: 2.0e-4

# the preference pairs (mask_dpo_data.py) and DPO on them (dpo_qwen.py). Both
# read sft_adapter and prefs -- the first writes that file, the second trains
# on it. dpo_lr is an order below repair_lr: 5e-6, the full-model DPO figure,
# moved a rank-16 LoRA by ~1% of what SFT moved it and scored exactly SFT.
sft_adapter: checkpoints/Qwen2.5-Omni-3B-mask-v2-hn-sft
prefs: results/mask_prefs_Qwen2.5-Omni-3B-mask-v2-hn-sft.jsonl
dpo_samples: 8
dpo_run_name: Qwen2.5-Omni-3B-mask-v2-hn-dpo
dpo_epochs: 2
dpo_lr: 2.0e-5
dpo_beta: 1.0

# the eval is NOT here: one run per model is one file under configs/eval/, so
# a ladder is three of them over this one track (configs/eval/mask-crf-*.yaml).
