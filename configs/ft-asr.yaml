# ft-asr track -- the whole track in one flat file, read by every stage:
#
#   python asr_data.py            --config configs/ft-asr.yaml   # ASR train set
#   python sft_qwen.py --task asr --config configs/ft-asr.yaml   # ASR LoRA
#   python asr_eval_qwen.py       --config configs/ft-asr.yaml --tag base
#   python babble_data.py         --config configs/ft-asr.yaml   # sent-4 build
#   python sft_qwen.py            --config configs/ft-asr.yaml   # repair LoRA
#   python babble_eval_qwen.py    --config configs/ft-asr.yaml
#

# Model
omni_path: Qwen/Qwen2.5-Omni-3B

prompt: restate

# --- the ASR witness ---

# its dataset (asr_data.py)
asr_ds_id: keylazy/slurp-asr-bab-devel-v1
slurp_split: devel
n_rows: 8000
snr_db: [0.0, 20.0]
clean_prob: 0.15
draws_per_utt: 1
test_every: 20       # hash(slurp_id) % 20 == 0 -> held out for WER

# its LoRA (sft_qwen.py --task asr)
asr_run_name: Qwen2.5-Omni-3B-asr-sft
asr_epochs: 2
asr_lr: 1.0e-4       # half the repair lr: the target is a verbatim transcript,
                     # and 2e-4 on 8K rows overfits devel fast
asr_batch_size: 16
asr_adapter: checkpoints/Qwen2.5-Omni-3B-asr-sft

# its diagnostic, the gate (asr_eval_qwen.py) -- steps/ft-asr-2.html step 8
n_best: 4            # the probe's ASR_N_BEST
sample_temp: 0.0     # >0 replaces beam search with K samples (the fallback)

# --- the sent-4 track that consumes it ---

# the build (babble_data.py)
label: sent-4
ds_id: keylazy/slurp-bab-Qwen2.5-Omni-3B-sent4-ftasr-v1
n_train: 1000
n_test: 100          # -> a 300-row test split; every eval pass judges all of it
n_extra_ans: 1000

# the repair LoRA (sft_qwen.py)
run_name: Qwen2.5-Omni-3B-bab-sent4ft-sft
epochs: 3
lr: 2.0e-4

# the eval (babble_eval_qwen.py). Per-kind judges, so C and R stay comparable
# with the beam rows in results/viz.ipynb; the type judge + tree matrix is a
# second pass with its own tag (see exp/ft-asr-run.sh).
judge_mode: per-kind
kinds: answer,repair,repeat
num_rows: -1
tag: sent4-ftasr