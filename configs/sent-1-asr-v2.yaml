# sent1asr-v2 -- NOT a rebuild. It reuses the sent1asr-v1 dataset unchanged and
# only re-runs what the 4da5e87 prompt/rubric changes invalidated:
#
#   * TASK_PROMPT_V2 gained the "ask a targeted question / ask to repeat"
#     clause, so the v1 adapter was trained under a prompt string that no
#     longer exists -> re-SFT.
#   * ANSWER_JUDGE_SYSTEM now scores a vague-but-right reply 0 (was 0.5) and
#     REPEAT_JUDGE_SYSTEM was rewritten -> re-eval.
#
# The dataset itself is untouched by both: the sent-1-asr probe decodes a
# transcript and skips the response pass, so no task prompt is rendered during
# the build, and the labeler (key_pieces / label_sent_ids) and target writer
# did not change. Rebuilding would spend ~11 h to reproduce the same rows.
#
#   CFG=configs/sent-1-asr-v2.yaml BUILD=0 sbatch --job-name=sent1asrv2 exp/sent-v2.slurm
#
# Keys a stage's Config does not declare are dropped SILENTLY -- read the
# "config: ..." line each script prints on start.

# Model
omni_path: Qwen/Qwen2.5-Omni-3B

# the v1 dataset, reused as-is. `label`/`n_*` are here only so a BUILD=1 run
# would reproduce it rather than silently building the default track.
label: sent-1-asr
ds_id: keylazy/slurp-bab-Qwen2.5-Omni-3B-sent1asr-v1
n_train: 1000
n_test: 100
n_extra_ans: 1000

# --- the repair LoRA (sft_qwen.py) ---
# v2 repo name: retraining under the v1 name would overwrite both
# checkpoints/Qwen2.5-Omni-3B-bab-sent1asr-sft and its Hub repo, and the v1
# numbers in results/ would then point at weights that no longer exist.
repair_ds_id: keylazy/slurp-bab-Qwen2.5-Omni-3B-sent1asr-v1
repair_repo_name: Qwen2.5-Omni-3B-bab-sent1asr-v2-sft
repair_epochs: 3
repair_lr: 2.0e-4
batch_size: 16

# --- the eval (babble_eval_qwen.py) ---
judge_mode: per-kind
kinds: answer,repair,repeat
num_rows: -1
tag: sent1asr-v2
